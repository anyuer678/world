name: CI

# README「本地开发」教的两条命令在这里变成强制门禁（R31）：
# 文档声称的命令如果跑不通，推送就会变红，而不是靠人记得去数。

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: 后端 pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 安装钉版依赖（uv.lock）
        run: uv sync --frozen
      # -o addopts="" 是必需的：pyproject 已有 addopts="-q"，命令行再给 -q 会变成 -qq
      # 并吞掉通过计数行（R30 实测）
      - name: 运行测试
        run: uv run pytest -o addopts="" -q --tb=short

  frontend:
    name: 前端 类型检查 + 测试 + 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装钉版依赖（package-lock.json）
        run: npm ci
      - name: vitest 单元测试
        run: npm run test
      - name: tsc -b + vite build
        run: npm run build
